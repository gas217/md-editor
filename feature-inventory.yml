# Feature inventory — source of truth for the Feature compliance metric (dimension 9).
# Every entry maps a VISION.md feature to required artifacts. A feature passes
# scoring if every artifact in `requires:` exists and `milestone` is V1.0, V1.1, or V2.
#
# Add a feature here when adding it to VISION.md. Removing without scaffolding evidence drops the score.

features:
  # Viewing
  - id: preview-by-default
    section: Viewing
    milestone: V1.0
    requires:
      - Tests/RenderPerformance.swift
      - Tests/RenderFidelity.swift
      - Preview/PreviewView.swift

  - id: six-supported-formats
    section: Viewing
    milestone: V1.1
    requires:
      - Tests/CSVRender.swift
      - Tests/JSONTree.swift
      - Tests/HTMLSandbox.swift

  - id: dark-mode
    section: Viewing
    milestone: V1.0
    requires:
