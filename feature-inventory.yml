      - Editor/EditorHostViewController.swift
      - Editor/web/src/editor.ts
      - Tests/TypingLatency.swift

  - id: source-mode
    section: Editing
    milestone: V1.0
    requires:
      - Editor/web/src/editor.ts
      - Tests/TypingLatency.swift

  - id: notion-inline-editing
    section: Editing
    # NOTE: this entry intentionally requires *future* files that don't yet exist.
    # When Story V1.1 ships slash-commands / drag-to-reorder / markdown-shortcut
    # conversion, those go in `Editor/web/src/notion.ts` and
    # `Tests/SlashCommands.swift`. Until then this feature scores as failing —
    # which is honest, not punishing.
    milestone: V1.1
    requires:
      - Editor/web/src/editor.ts
      - Editor/web/src/notion.ts
      - Tests/TypingLatency.swift
      - Tests/SlashCommands.swift

