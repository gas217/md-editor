name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build and test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: make project

      - name: Build
        # Real build; failure here means the build_score in `score` cannot honestly be 100.
        run: make build

      - name: Run tests
        # Tests/ stubs all XCTFail until V1.0 stories land — keep going on failure
        # so we get the full picture in CI logs.
        run: make test
        continue-on-error: true

      - name: Binary size check
        run: ./Tests/BinarySize.sh
        continue-on-error: true

  score:
    name: Build-readiness score
    runs-on: macos-14
    # Score depends on build so we never grant 100 for build_score without a real build.
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Run scoring rubric
        run: ./scripts/score.sh
      - name: Upload score.json
        uses: actions/upload-artifact@v4
        with:
          name: score-json
          path: score.json
      - name: Enforce 95% gate
        run: |
          avg=$(jq -r '.average' score.json)
          min=$(jq -r '.minimum' score.json)
          gate=$(jq -r '.gate_met' score.json)
          echo "Average: $avg / 95"
          echo "Minimum: $min / 80"
          if [ "$gate" != "true" ]; then
            echo "::warning::Build-readiness gate not met (avg=$avg, min=$min). See METRICS.md."
            # Soft fail during V1.0 build; flip to hard fail after V1.0 ships.
          fi
