name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Editor/web/package-lock.json

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: make project

      - name: Check build failure reporting
        run: python3 scripts/test-build-harness.py

      - name: Test included renderer
        run: swift test --package-path Vendor/preview-md-shared

      - name: Build
        # Real build; failure here means the build_score in `score` cannot honestly be 100.
        run: make build

      - name: Run tests
        # Unimplemented acceptance criteria use XCTSkip; real failures gate CI.
        run: make test

      - name: Binary size check
        # Advisory until the release-size budget is met; measure a real bundle.
        run: |
          make build-release
          ./Tests/BinarySize.sh
        continue-on-error: true

      - name: Run E2E suite
        # UI scenarios and remaining assertion gaps: docs/e2e-test-plan.md.
        # Actual failures remain blocking.
        # Requires a macOS runner with UI testing / Automation access.
        run: make e2e

      - name: Upload test result bundles (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-xcresult
          path: |
            build/unit-result.xcresult
            build/e2e-result.xcresult
          if-no-files-found: ignore

  score:
    name: Build-readiness score
    runs-on: macos-15
    # Score depends on build so we never grant 100 for build_score without a real build.
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Editor/web/package-lock.json
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Run scoring rubric
        run: ./scripts/score.sh
      - name: Upload score.json
        uses: actions/upload-artifact@v4
        with:
          name: score-json
          path: score.json
      - name: Report readiness threshold (advisory)
        run: |
          avg=$(jq -r '.average' score.json)
          min=$(jq -r '.minimum' score.json)
          gate=$(jq -r '.gate_met' score.json)
          echo "Average: $avg / 95"
          echo "Minimum: $min / 80"
          if [ "$gate" != "true" ]; then
            echo "::warning::Build-readiness gate not met (avg=$avg, min=$min). See METRICS.md."
            # Soft fail during V1.0 build; flip to hard fail after V1.0 ships.
          fi
